<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>异形棋盘</title>
<meta name="description" content="四周随机生成的异形围棋盘，发个链接就能和朋友联机下棋。">
<meta property="og:title" content="异形棋盘">
<meta property="og:description" content="四周随机生成的异形围棋盘，发个链接就能和朋友联机下棋。">
<meta name="theme-color" content="#E0E4DF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171C19" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23E0B26C'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23181817'/%3E%3Ccircle cx='12.5' cy='12.5' r='3' fill='%23555551'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=ZCOOL+XiaoWei&display=swap">
<style>
/* Layout: an irregular kaya slab owns the left (sticky); a quiet instrument column scrolls on the right, stacked under the board on phones */
:root{
  --bg:#E0E4DF; --surface:#ECEFEA; --ink:#1D2320; --muted:#646D67; --rule:#C6CCC6;
  --accent:#B4432E; --on-accent:#FBF2EC; --ok:#2F7D52;
  --btn:#F6F7F4; --primary:#1D2320; --primary-ink:#F1F3EF;
  --display:"ZCOOL XiaoWei","Songti SC","STSong","Noto Serif SC",serif;
  --body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#171C19; --surface:#1F2622; --ink:#E4E8E3; --muted:#8E9790; --rule:#313934;
    --accent:#DD6750; --on-accent:#1B0F0B; --ok:#5EC28B;
    --btn:#252C28; --primary:#E4E8E3; --primary-ink:#171C19; color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{background:var(--bg)}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:14px; line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:max(20px, env(safe-area-inset-top, 0px));
  padding-bottom:max(20px, env(safe-area-inset-bottom, 0px));
}
.app{max-width:1240px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:36px; align-items:start}
.stage{min-width:0; display:flex; justify-content:center; position:sticky; top:20px}
.board-wrap{width:min(100%, calc(100vh - 40px)); aspect-ratio:1/1; max-width:100%}
@supports (height:100dvh){ .board-wrap{width:min(100%, calc(100dvh - 40px))} }
canvas{display:block; touch-action:manipulation; -webkit-tap-highlight-color:transparent}

.panel{display:flex; flex-direction:column; gap:20px; min-width:0}
.brand{display:flex; gap:14px; align-items:center}
.seal{
  flex:none; width:46px; height:46px; border-radius:7px; background:var(--accent); color:var(--on-accent);
  display:grid; place-items:center; font-family:var(--display); font-size:27px; line-height:1; transform:rotate(-4deg);
}
h1{margin:0; font-family:var(--display); font-weight:400; font-size:31px; letter-spacing:.06em; line-height:1.15; text-wrap:balance}
.sub{margin:2px 0 0; color:var(--muted); font-size:12.5px}

.room{display:grid; gap:12px}
.room-body{display:grid; gap:10px}
.join{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; margin:0}
.join input{
  font-family:var(--mono); font-size:15px; letter-spacing:.24em; text-transform:uppercase;
  padding:8px 12px; border-radius:8px; border:1px solid var(--rule); background:var(--btn); color:var(--ink); min-width:0;
}
.join input::placeholder{letter-spacing:.04em; text-transform:none; color:var(--muted); font-family:var(--body); font-size:13px}
.code-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px 10px 14px; border:1px solid var(--rule); border-radius:10px; background:var(--surface)}
.eyebrow{display:block; font-size:11px; letter-spacing:.2em; color:var(--muted)}
.code{font-family:var(--mono); font-size:26px; font-weight:500; letter-spacing:.2em; line-height:1.2; user-select:all}
.hint{margin:0; font-size:12.5px; color:var(--muted)}
.hint.warn{color:var(--accent)}
.takeover{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.linkbtn{background:none; border:0; padding:0; font:inherit; font-size:12.5px; color:var(--muted); text-decoration:underline; text-underline-offset:3px; cursor:pointer; justify-self:start}

.players{display:grid; gap:6px}
.plist{display:grid; gap:6px}
.player.out{opacity:.5}
.player{
  display:grid; grid-template-columns:24px minmax(0,1fr) auto auto; align-items:center; gap:10px;
  padding:10px 12px; border-radius:10px; border:1px solid transparent; transition:background-color .2s, border-color .2s;
}
.player.on{background:var(--surface); border-color:var(--rule)}
.chipbtn{width:24px; height:24px; padding:0; border:0; border-radius:50%; background:none; display:grid; place-items:center; cursor:pointer}
.chipbtn:disabled{cursor:default}
.chipbtn:not(:disabled):hover, .chipbtn.picking{box-shadow:0 0 0 2px var(--accent)}
canvas.chip{width:22px; height:22px; display:block}
.chg{font:inherit; font-size:12px; padding:2px 10px; border-radius:999px; border:1px solid var(--rule); background:var(--btn); color:var(--ink); cursor:pointer; white-space:nowrap}
.chg:hover{border-color:var(--muted)}
.lineup-head{display:grid; gap:2px; padding:0 2px 4px}
.lineup-head .lt{font-family:var(--display); font-size:22px; letter-spacing:.04em; line-height:1.2}
.lineup-head .ls{font-size:12.5px; color:var(--muted)}
.plist.lineup .player{grid-template-columns:46px minmax(0,1fr) auto; padding:12px 12px 12px 10px; background:var(--surface); border-color:var(--rule)}
.plist.lineup .chipbtn{width:46px; height:46px}
.plist.lineup canvas.chip{width:42px; height:42px}
.plist.lineup .pname{font-size:16px; flex-direction:column; align-items:flex-start; gap:0}
.plist.lineup .cap, .plist.lineup .pill{display:none}
.plist.lineup .chg{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-size:13.5px; font-weight:600; padding:7px 16px}
.plist.lineup .chg:hover{opacity:.9}
.modal{
  position:fixed; inset:0; z-index:50; display:grid; place-items:center; background:rgba(10,14,12,.5);
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet{width:min(100%, 660px); max-height:100%; overflow:auto; background:var(--bg); border:1px solid var(--rule); border-radius:14px; padding:18px; display:grid; gap:14px; box-shadow:0 24px 60px rgba(0,0,0,.28)}
.sheet-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap}
.sheet-title{font-family:var(--display); font-size:25px; letter-spacing:.03em; line-height:1.2}
.pv-wrap{height:112px; min-width:0}
.pv-wrap canvas{display:block; border-radius:10px; cursor:default}
.pick-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px}
.pick-grid button{
  position:relative; min-width:0; display:flex; flex-direction:column; align-items:center; gap:1px;
  padding:6px 3px 8px; border:1px solid var(--rule); border-radius:12px; background:var(--surface); color:var(--ink); font:inherit; cursor:pointer;
}
.pick-grid button:hover:not(:disabled){border-color:var(--muted)}
.pick-grid button[aria-pressed="true"]{border:2px solid var(--accent); padding:5px 2px 7px}
.pick-grid button:disabled{cursor:default}
.pick-grid button:disabled canvas, .pick-grid button:disabled .en{opacity:.38}
.pick-grid canvas{display:block; width:100%; max-width:68px; aspect-ratio:1/1; height:auto; border-radius:10px; margin-bottom:4px}
.pick-grid .en{font-size:13px; font-weight:600; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pick-grid .zh{font-size:11px; color:var(--muted)}
.pick-grid .tag{position:absolute; top:10px; left:50%; transform:translateX(-50%); font-family:var(--mono); font-size:11px; padding:0 8px; line-height:18px; border-radius:9px; background:var(--btn); border:1px solid var(--rule); color:var(--muted)}
.pick-grid .ck{position:absolute; top:5px; right:5px; width:20px; height:20px; border-radius:50%; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; font-size:12px; line-height:1}
.sheet-foot{display:flex; justify-content:space-between; align-items:center; gap:12px}
@media (max-width:560px){ .pick-grid{grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px} .pick-grid .en{font-size:11.5px; letter-spacing:-.01em} .sheet{padding:14px} }
.pname{font-weight:600; display:flex; align-items:center; gap:8px; min-width:0}
.who{font-size:12px; font-weight:400; color:var(--muted); display:inline-flex; align-items:center; gap:5px}
.dot{width:7px; height:7px; border-radius:50%; border:1.5px solid var(--muted)}
.dot.on{background:var(--ok); border-color:var(--ok)}
.pill{font-size:11px; font-weight:500; color:var(--accent); border:1px solid currentColor; border-radius:999px; padding:0 8px; line-height:18px; visibility:hidden; white-space:nowrap}
.player.on .pill{visibility:visible}
.cap{font-family:var(--mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.cap b{color:var(--ink); font-weight:500; font-size:15px; margin-left:4px}
.status{font-size:13px; color:var(--muted); min-height:1.55em; padding:2px 2px 0}
.status.warn{color:var(--accent)}

.banner{display:grid; gap:6px; padding:12px 14px; border-radius:10px; background:var(--surface); border:1px solid var(--rule)}
.banner p{margin:0}
.banner .bt{font-size:14px; font-weight:600}
.banner .bs{font-size:12.5px; color:var(--muted)}
.banner.final .bt{font-family:var(--display); font-weight:400; font-size:28px; letter-spacing:.05em; line-height:1.2}
.banner-acts{display:flex; gap:8px; margin-top:4px}
.banner-acts:empty{display:none}
.banner-acts .btn{flex:1 1 0}

.actions > div{display:flex; gap:8px}
.actions .btn{flex:1 1 0; min-width:0}
.btn{
  font:inherit; font-size:13px; padding:9px 6px; border-radius:8px; border:1px solid var(--rule);
  background:var(--btn); color:var(--ink); cursor:pointer; transition:border-color .15s, color .15s; white-space:nowrap;
}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45; cursor:default}
.btn.armed, .btn.armed:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
button:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.primary{background:var(--primary); color:var(--primary-ink); border-color:var(--primary); padding:10px; font-size:14px}
.primary:hover:not(:disabled){border-color:var(--primary); opacity:.92}
.code-row .btn{padding:8px 12px}

.shape{border-top:1px solid var(--rule); padding-top:18px; display:grid; gap:14px}
.shape h2{margin:0; font-size:11.5px; font-weight:500; letter-spacing:.24em; color:var(--muted)}
.field{display:grid; gap:8px}
.row{display:flex; justify-content:space-between; align-items:center; gap:12px}
.label{font-size:13px}
.val{font-family:var(--mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.seg{display:grid; grid-template-columns:repeat(3,1fr); gap:3px; padding:3px; border:1px solid var(--rule); border-radius:9px; background:var(--surface)}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seatlist{display:grid; border:1px solid var(--rule); border-radius:10px; overflow:hidden; background:var(--surface)}
.seatlist button{
  display:grid; grid-template-columns:30px minmax(0,1fr) auto 18px; align-items:center; gap:12px;
  padding:10px 14px 10px 12px; border:0; border-top:1px solid var(--rule); background:transparent; color:var(--ink); font:inherit; text-align:left; cursor:pointer;
}
.seatlist button:first-child{border-top:0}
.seatlist button:hover{background:var(--btn)}
.seatlist button[aria-checked="true"]{background:var(--btn)}
.seatlist canvas{width:28px; height:28px; display:block}
.seatlist .nm{display:grid; line-height:1.25; min-width:0}
.seatlist .nm b{font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.seatlist .nm small{font-size:11.5px; color:var(--muted)}
.seatlist .ord{font-size:12px; color:var(--muted); white-space:nowrap}
.seatlist .radio{width:18px; height:18px; border-radius:50%; border:1.5px solid var(--muted); display:grid; place-items:center}
.seatlist button[aria-checked="true"] .radio{border-color:var(--accent)}
.seatlist button[aria-checked="true"] .radio::after{content:""; width:9px; height:9px; border-radius:50%; background:var(--accent)}
.seg button{font-family:var(--mono); font-size:13px; border:0; background:transparent; color:var(--muted); padding:6px 0; border-radius:6px; cursor:pointer}
.seg.text button{font-family:var(--body)}
.seg button[aria-pressed="true"]{background:var(--btn); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.14)}
.seg button:disabled{cursor:default; opacity:.5}
input[type="range"]{width:100%; margin:0; accent-color:var(--accent)}
input[type="range"]:disabled{opacity:.5}
.scale{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); margin-top:-4px}
.switch{
  appearance:none; -webkit-appearance:none; flex:none; width:36px; height:20px; margin:0; border-radius:999px;
  background:var(--rule); position:relative; cursor:pointer; transition:background-color .2s;
}
.switch::after{
  content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
  background:var(--btn); box-shadow:0 1px 2px rgba(0,0,0,.28); transition:transform .2s;
}
.switch:checked{background:var(--ink)}
.switch:checked::after{transform:translateX(16px)}
.switch:disabled{opacity:.5; cursor:default}
.meta{margin:-4px 0 0; font-size:12px; color:var(--muted)}
.meta .mono{font-family:var(--mono); font-variant-numeric:tabular-nums}

@media (max-width:860px){
  body{padding-top:max(16px, env(safe-area-inset-top, 0px))}
  .app{display:flex; flex-direction:column; gap:18px; align-items:stretch}
  .panel{display:contents}
  .brand{order:-1}
  .stage{order:0; position:static}
  .room,.players,.banner,.actions,.shape{order:1}
  .board-wrap{width:100%}
  h1{font-size:27px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="app">
  <main class="stage">
    <div class="board-wrap" id="wrap"><canvas id="board" role="img" aria-label="异形围棋棋盘"></canvas></div>
  </main>

  <aside class="panel">
    <header class="brand">
      <div class="seal" aria-hidden="true">異</div>
      <div>
        <h1>异形棋盘</h1>
        <p class="sub">随机异形围棋盘 · 2 到 4 色 · 可联机</p>
      </div>
    </header>

    <section class="room">
      <div class="seg two text" role="group" aria-label="对局方式">
        <button type="button" id="tabLocal" aria-pressed="true">本机对弈</button>
        <button type="button" id="tabOnline" aria-pressed="false">联机对弈</button>
      </div>
      <div class="room-body" id="roomIdle" hidden>
        <div class="field">
          <span class="label">我执</span>
          <div class="seatlist" id="colorSeg" role="radiogroup" aria-label="我执"></div>
        </div>
        <button class="btn primary" id="createBtn" type="button">创建房间</button>
        <form class="join" id="joinForm">
          <input id="codeIn" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="输入房间号" aria-label="房间号">
          <button class="btn" id="joinBtn" type="submit">加入</button>
        </form>
        <p class="hint" id="idleHint">正在连接联机服务…</p>
      </div>
      <div class="room-body" id="roomOn" hidden>
        <div class="code-row">
          <div><span class="eyebrow">房间号</span><span class="code" id="codeTxt"></span></div>
          <button class="btn" id="copyBtn" type="button">复制邀请链接</button>
        </div>
        <p class="hint" id="roomInfo"></p>
        <div class="takeover" id="takeover" hidden>
          <span class="hint">换了浏览器？回到自己的座位：</span>
          <span class="takeover" id="takeBtns"></span>
        </div>
        <button class="linkbtn" id="leaveBtn" type="button">离开房间</button>
      </div>
      <p class="hint warn" id="roomErr" hidden></p>
    </section>

    <section class="players" aria-live="polite">
      <div class="lineup-head" id="lineupHead" hidden>
        <span class="lt">开局前，先选棋子</span>
        <span class="ls">14 种样式，每人挑一种，别人选过的不能重复。下第一手后也能随时再换。</span>
      </div>
      <div class="plist" id="plist"></div>
      <div class="status" id="status"></div>
      <p class="hint" id="styleHint" hidden></p>
    </section>

    <section class="banner" id="banner" hidden>
      <p class="bt" id="bannerTxt"></p>
      <p class="bs" id="bannerSub"></p>
      <div class="banner-acts" id="bannerActs"></div>
    </section>

    <section class="actions">
      <div id="actPlay">
        <button class="btn" id="undoBtn" type="button">悔棋</button>
        <button class="btn" id="passBtn" type="button">停一手</button>
        <button class="btn" id="resignBtn" type="button">认输</button>
        <button class="btn" id="resetBtn" type="button">重新开局</button>
      </div>
      <div id="actScore" hidden>
        <button class="btn primary" id="confirmBtn" type="button">确认结果</button>
        <button class="btn" id="resumeBtn" type="button">继续下棋</button>
      </div>
      <div id="actEnd" hidden>
        <button class="btn primary" id="againBtn" type="button">再来一盘</button>
        <button class="btn" id="swapBtn" type="button">交换黑白再来</button>
        <button class="btn" id="endUndoBtn" type="button">悔棋</button>
      </div>
    </section>

    <section class="shape">
      <h2>棋盘设置</h2>
      <div class="field">
        <span class="label">颜色数</span>
        <div class="seg text" id="playersSeg" role="group" aria-label="颜色数">
          <button type="button" data-p="2" aria-pressed="true">双色</button>
          <button type="button" data-p="3" aria-pressed="false">三色</button>
          <button type="button" data-p="4" aria-pressed="false">四色</button>
        </div>
      </div>
      <div class="field">
        <span class="label">路数</span>
        <div class="seg" id="sizeSeg" role="group" aria-label="路数">
          <button type="button" data-n="9" aria-pressed="false">9</button>
          <button type="button" data-n="13" aria-pressed="false">13</button>
          <button type="button" data-n="19" aria-pressed="true">19</button>
        </div>
      </div>
      <div class="field">
        <div class="row"><label class="label" for="rough">边缘侵蚀</label><span class="val" id="roughVal">55</span></div>
        <input type="range" id="rough" min="0" max="100" value="55">
        <div class="scale"><span>方正</span><span>破碎</span></div>
      </div>
      <div class="row"><label class="label" for="holes">内部空洞</label><input type="checkbox" class="switch" id="holes" role="switch"></div>
      <p class="hint" id="multiHint" hidden></p>
      <div class="field" id="komiField">
        <span class="label">贴目（中国规则数子）</span>
        <div class="seg four" id="komiSeg" role="group" aria-label="贴目">
          <button type="button" data-k="0" aria-pressed="false">0</button>
          <button type="button" data-k="5.5" aria-pressed="false">5.5</button>
          <button type="button" data-k="6.5" aria-pressed="false">6.5</button>
          <button type="button" data-k="7.5" aria-pressed="true">7.5</button>
        </div>
      </div>
      <div class="row"><label class="label" for="coords">坐标</label><input type="checkbox" class="switch" id="coords" role="switch" checked></div>
      <button class="btn primary" id="regen" type="button">换一个形状</button>
      <p class="meta"><span class="mono">No.<span id="seedTxt"></span></span> · <span id="ptsTxt"></span></p>
      <p class="hint" id="lockHint" hidden></p>
    </section>
  </aside>
</div>

<div class="modal" id="picker" hidden role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
  <div class="sheet">
    <div class="sheet-head">
      <span class="sheet-title" id="pickerTitle">Choose your stone</span>
      <span class="hint" id="pickerSub"></span>
    </div>
    <div class="pv-wrap" id="pvWrap"><canvas id="pv" aria-hidden="true"></canvas></div>
    <div class="pick-grid" id="pickGrid"></div>
    <div class="sheet-foot">
      <span class="hint" id="pickerNote"></span>
      <button class="btn primary" id="pickerClose" type="button">完成</button>

  function hit(ev) {
    if (!geom) return -1;
    const rect = cv.getBoundingClientRect();
    const x = ev.clientX - rect.left, y = ev.clientY - rect.top;
    const gx = Math.round((x - geom.pad) / geom.step), gy = Math.round((y - geom.pad) / geom.step);
    if (gx < 0 || gy < 0 || gx >= SH.N || gy >= SH.N) return -1;
    const i = gy * SH.N + gx;
    if (!SH.act[i]) return -1;
    const [px, py] = P(i);
    return Math.hypot(px - x, py - y) <= geom.step * 0.5 ? i : -1;
  }

  $("joinForm").addEventListener("submit", (e) => { e.preventDefault(); joinRoom($("codeIn").value); });
  $("leaveBtn").addEventListener("click", () => { tab = "online"; roomErr(""); leaveRoom(); });
  $("copyBtn").addEventListener("click", () => {
    const text = inviteLink(), btn = $("copyBtn");
    const done = () => { btn.textContent = "已复制"; setTimeout(() => { btn.textContent = "复制邀请链接"; }, 1600); };
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.append(ta); ta.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      ta.remove();
      if (ok) done(); else roomErr("没能自动复制，邀请链接是：" + text);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  });
  window.addEventListener("hashchange", () => {
    const h = location.hash.replace("#", "").toUpperCase();
    if (db && /^[A-Z0-9]{4}$/.test(h) && h !== roomCode) { tab = "online"; joinRoom(h); }
  });

  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(layout); }).observe(wrap);
  const refresh = () => { if (geom) { buildStatic(); draw(); } };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refresh);
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", refresh);

  derive();

  F = await initNet();
  db = F ? makeDb(F) : null;
  dbReady = true;
  {
    const h = location.hash.replace("#", "");
    const fromLink = /^[A-Za-z0-9]{4}$/.test(h);
    const code = fromLink ? h.toUpperCase() : ls.get("igo.room");
    if (fromLink) tab = "online";
    if (db && code) { tab = "online"; joinRoom(code); }
    else render();
  }
</script>
</body>
</html>
